<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span class="brand-text">{{ site.title }}</span>
    </a>
    <div class="header-actions">
      <a class="icon-btn" href="{{ '/search/' | relative_url }}" aria-label="Search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </a>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode">
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <nav class="nav" aria-label="Main">
      {%- for s in site.data.sections %}
      {%- assign sec_url = '/' | append: s.id | append: '/' %}
      <a href="{{ sec_url | relative_url }}" style="--sec: {{ s.color }}"{% if page.url == sec_url or page.collection == s.id %} aria-current="page"{% endif %}>{{ s.title }}</a>
      {%- endfor %}
      <a href="{{ '/tags/' | relative_url }}"{% if page.url == '/tags/' %} aria-current="page"{% endif %}>Tags</a>
    </nav>
  </div>
</header>
